<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1313" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A JRPG-styled idle clicker game about ramen and graduation." />
    
    <title>Ramen Nights & Budget Bites</title>
    
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
      .font-pixel-header { font-family: 'Press Start 2P', cursive; line-height: 1.5; text-shadow: 2px 2px 0 #000; }
      .font-pixel-body { font-family: 'DotGothic16', sans-serif; font-size: 1.1rem; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #fff; border: 1px solid #000; }

      @keyframes float-up {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-60px); opacity: 0; }
      }
      .animate-float-up { animation: float-up 0.8s ease-out forwards; }
      
      @keyframes appear {
        0% { transform: translateY(20px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .animate-appear { animation: appear 0.3s ease-out forwards; }

      /* Weather Animations */
      @keyframes rain {
        0% { background-position: 0 0; }
        100% { background-position: 20px 60px; }
      }
      .animate-rain {
        background-image: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(150,180,255,0.4) 50%, rgba(255,255,255,0) 100%);
        background-size: 2px 20px;
        background-repeat: repeat;
        animation: rain 0.5s linear infinite;
      }

      @keyframes snow {
        0% { background-position: 0 0; }
        100% { background-position: 50px 100px; }
      }
      .animate-snow {
        background-image: radial-gradient(circle, #fff 20%, transparent 20%);
        background-size: 8px 8px; 
        animation: snow 3s linear infinite;
      }

      @keyframes lightning {
        0%, 95%, 100% { opacity: 0; }
        96% { opacity: 0.8; }
        98% { opacity: 0.2; }
        99% { opacity: 0.9; }
      }
      .animate-lightning { animation: lightning 5s infinite; }

      @keyframes fog {
        0% { transform: translateX(-10%); opacity: 0.3; }
        50% { transform: translateX(10%); opacity: 0.6; }
        100% { transform: translateX(-10%); opacity: 0.3; }
      }
      .animate-fog { animation: fog 10s ease-in-out infinite; }

      @keyframes petals {
        0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(40px, 100px) rotate(360deg); opacity: 0; }
      }
      .petal {
        position: absolute;
        width: 6px;
        height: 8px;
        background: #ffb7c5;
        border-radius: 50% 0 50% 50%;
        animation: petals 4s linear infinite;
      }

      @keyframes aurora {
        0% { filter: hue-rotate(0deg); opacity: 0.3; }
        50% { filter: hue-rotate(180deg); opacity: 0.6; }
        100% { filter: hue-rotate(360deg); opacity: 0.3; }
      }
      .animate-aurora { animation: aurora 8s ease-in-out infinite; }

      @keyframes sandstorm {
        0% { transform: translateX(-20px) translateY(0); }
        100% { transform: translateX(20px) translateY(5px); }
      }
      .animate-sand {
        background: radial-gradient(circle, rgba(139,69,19,0.3) 10%, transparent 10%);
        background-size: 15px 15px;
        animation: sandstorm 0.1s linear infinite;
      }

      @keyframes clouds {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .animate-cloud-slow { animation: clouds 30s linear infinite; }
      .animate-cloud-fast { animation: clouds 15s linear infinite; }

      @keyframes heat {
        0% { opacity: 0.1; background-color: rgba(255, 100, 0, 0); }
        50% { opacity: 0.3; background-color: rgba(255, 100, 0, 0.2); }
        100% { opacity: 0.1; background-color: rgba(255, 100, 0, 0); }
      }
      .animate-heat { animation: heat 2s ease-in-out infinite; }

      /* Landscape Rotation Overlay - Lowered max-height to 300px to support mobile phones in landscape */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #1a1313;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        padding: 2rem;
      }

      @media (orientation: landscape) and (max-height: 300px) {
        #rotate-overlay { display: flex; }
        #root { display: none; }
      }

      body {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior-y: none;
        overflow: hidden;
      }

      /* Desktop Layout Adjustments - Also triggered by general landscape orientation */
      @media (orientation: landscape) {
        .game-container {
          max-width: 1200px !important;
          flex-direction: row !important;
          gap: 1rem;
          padding: 1rem;
        }
        .main-pane {
          flex: 1.2 !important;
        }
        .side-pane {
          flex: 1 !important;
          display: flex !important; /* Force show side panel in landscape */
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#1a1313]">
    <div id="rotate-overlay">
      <span class="material-icons text-6xl text-yellow-400 mb-4">screen_rotation</span>
      <h2 class="font-pixel-header text-lg mb-2">PLEASE ROTATE</h2>
      <p class="font-pixel-body">This kitchen is too small for this screen height. Please use portrait or a taller screen.</p>
    </div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
